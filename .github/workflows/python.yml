name: Python Package

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
    tags:
      - '*'

jobs:
  elf:
    runs-on: ubuntu-latest
    name: Build Practice Mod ELFs

    strategy:
      matrix:
        game_version:
          gc_ntsc
          # gc_pal
        
        practice_mod_mode:
          disabled
          full

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: 'recursive'
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build
        run: uv run build_elf.py src/open_prime_rando_practice_mod/elfs -v ${{ matrix.game_version }} -m ${{ matrix.practice_mod_mode }}

      - name: Store the elf
        uses: actions/upload-artifact@v7
        with:
          name: practice-mod-elf-${{ matrix.game_version }}-${{ matrix.practice_mod_mode }}
          path: src/open_prime_rando_practice_mod/elfs/${{ matrix.game_version }}_${{ matrix.practice_mod_mode }}.elf

  wheel:
    runs-on: ubuntu-latest
    name: Wheel
    needs:
      - elf

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.7.20"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Download the elf
        uses: actions/download-artifact@v7
        with:
          pattern: practice-mod-elf-*
          path: src/open_prime_rando_practice_mod/elfs/
          merge-multiple: true

      - name: build
        run: uv build

      - name: Store the packages
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist

  test:
    runs-on: 'ubuntu-latest'
    needs:
      - wheel

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
  
      - name: Download all the dists
        uses: actions/download-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install the package
        run: pip install dist/*.whl pytest

      - name: Run tests
        run: python -m pytest

  pypi:
    runs-on: 'ubuntu-latest'
    needs:
      - wheel
      - test

    permissions:
      id-token: write
    
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish 📦 to PyPI
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: pypa/gh-action-pypi-publish@release/v1
